name: hark-render
on:
  workflow_dispatch:
    inputs:
      parts: {default: '6'}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          N=${{ inputs.parts }}; T=1569
          python3 -c "import json;N=$N;T=$T;s=-(-T//N);print('matrix='+json.dumps({'include':[{'i':i,'a':i*s,'b':min(T,(i+1)*s)-1} for i in range(N) if i*s<T]}))" >> $GITHUB_OUTPUT
  part:
    needs: plan
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: hark}}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: hark/package-lock.json}
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npx remotion browser ensure
      - run: |
          S=$(date +%s)
          npx remotion render src/lowpoly/stories/pursue-07-triangle/entry.jsx TRI part.mp4 --frames=${{ matrix.a }}-${{ matrix.b }} --muted --concurrency=4 --codec=h264 --crf=12 --jpeg-quality=95
          echo "part ${{ matrix.i }} took $(( $(date +%s)-S ))s"
          mv part.mp4 part_$(printf %02d ${{ matrix.i }}).mp4
      - uses: actions/upload-artifact@v4
        with: {name: 'part-${{ matrix.i }}', path: 'hark/part_*.mp4', retention-days: 2}
  join:
    needs: part
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: parts, merge-multiple: true}
      - run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          ls parts | sort | sed "s/^/file 'parts\//;s/$/'/" > list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -i hark/public/final_audio.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest final.mp4
          ffprobe -v error -show_entries format=duration:stream=width,height,nb_frames final.mp4
      - uses: actions/upload-artifact@v4
        with: {name: hark-final, path: final.mp4, retention-days: 3}
