name: ia-render
run-name: render ${{ inputs.name }}
on:
  workflow_dispatch:
    inputs:
      name: {required: true}
      entry: {required: true}
      comp: {required: true}
      frames: {required: true}
      audio: {default: ''}
      parts: {default: '6'}
      crf: {default: '12'}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 -c "import json;N=int('${{ inputs.parts }}');T=int('${{ inputs.frames }}');s=-(-T//N);print('matrix='+json.dumps({'include':[{'i':i,'a':i*s,'b':min(T,(i+1)*s)-1} for i in range(N) if i*s<T]}))" >> $GITHUB_OUTPUT
  part:
    needs: plan
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: rm}}
    strategy:
      fail-fast: true
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: rm/package-lock.json}
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npx remotion browser ensure
      - run: |
          npx remotion render "${{ inputs.entry }}" "${{ inputs.comp }}" part.mp4 --frames=${{ matrix.a }}-${{ matrix.b }} --muted --concurrency=4 --codec=h264 --crf=${{ inputs.crf }} --jpeg-quality=95
          mv part.mp4 part_$(printf %02d ${{ matrix.i }}).mp4
      - uses: actions/upload-artifact@v4
        with: {name: 'part-${{ matrix.i }}', path: 'rm/part_*.mp4', retention-days: 1}
  join_qa:
    needs: part
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "rm/public/_audio\n.github"}
      - uses: actions/download-artifact@v4
        with: {path: parts, pattern: 'part-*', merge-multiple: true}
      - run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg imagemagick >/dev/null
          ls parts | sort | sed "s/^/file 'parts\//;s/$/'/" > list.txt
          A="${{ inputs.audio }}"
          if [ -n "$A" ]; then ffmpeg -v error -y -f concat -safe 0 -i list.txt -i "rm/$A" -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest final.mp4
          else ffmpeg -v error -y -f concat -safe 0 -i list.txt -c copy final.mp4; fi
          bash .github/qa.sh final.mp4 qa
      - uses: actions/upload-artifact@v4
        with: {name: final, path: final.mp4, retention-days: 3}
      - uses: actions/upload-artifact@v4
        with: {name: qa, path: qa/, retention-days: 7}
